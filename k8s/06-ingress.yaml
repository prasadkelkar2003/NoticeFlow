apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noticeflow-ingress
  namespace: noticeflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: noticeflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: noticeflow-api-service
                port:
                  number: 3000
